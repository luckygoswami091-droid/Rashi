<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Rashi!</title>

<style>
body { margin: 0; padding: 0; background-color: #1a0505; color: white; font-family: 'Segoe UI'; }
.container { max-width: 500px; margin: auto; padding: 20px; text-align: center; }

.page { display: none; min-height: 90vh; justify-content: center; align-items: center; flex-direction: column; }
.active { display: flex; }

.img-box {
    width: 90%;
    border: 2px solid #fff;
    border-radius: 15px;
    overflow: hidden;
    margin-bottom: 15px;
}

.img-box img {
    width: 100%;
    height: auto;
}

.main-btn {
    width: 85%;
    padding: 15px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}

.back-btn {
    width: 70%;
    padding: 10px;
    background: gray;
    border: none;
    border-radius: 20px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<!-- PAGE 1 -->
<div id="p1" class="page active">
<h2>Open Your Surprise ✉️</h2>

<div class="img-box">
<img src="Photo1.jpeg">
</div>

<button class="main-btn" onclick="showPage('p_new')">OPEN SEAL</button>
</div>


<!-- NEW PAGE -->
<div id="p_new" class="page">
<h2>✨ A Little Surprise ✨</h2>

<div class="img-box">
<img src="newPhoto.jpeg"> <!-- CHECK NAME HERE -->
</div>

<button class="main-btn" onclick="showPage('p2')">Click here to Surprise 🎁</button>
</div>


<!-- PAGE 2 -->
<div id="p2" class="page">
<h2>Choose a Gift 🎁</h2>

<div class="img-box">
<img src="Photo2.jpeg">
</div>

<button class="main-btn" onclick="showPage('p1')">Back</button>
</div>

</div>


<script>
function showPage(pageId) {
    var pages = document.querySelectorAll('.page');
    pages.forEach(p => p.classList.remove('active'));

    var target = document.getElementById(pageId);
    if (target) {
        target.classList.add('active');
    } else {
        alert("Page not found: " + pageId);
    }
}
</script>

</body>
</html>
