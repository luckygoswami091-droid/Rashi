<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Rashi!</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a0505; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; text-align: center; }
        
        .page { display: none; min-height: 90vh; flex-direction: column; justify-content: center; align-items: center; }
        .active { display: flex; }

        /* ✅ FIXED HEIGHT (no image movement) */
        .img-box {
            width: 90%;
            height: 300px;
            border: 2px solid #fff;
            border-radius: 15px;
            background: #331111;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .main-btn { width: 85%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .back-btn { width: 70%; padding: 10px; background: #7f8c8d; color: white; border: none; border-radius: 20px; margin-top: 20px; cursor: pointer; }
        
        .gift-grid { display: flex; justify-content: space-around; width: 100%; margin: 20px 0; }
        .gift-item { width: 28%; background: #c0392b; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">

    <div id="p1" class="page active">
        <h2>Open Your Surprise ✉️</h2>
        <div class="img-box">
            <img src="Photo1.jpeg">
        </div>
        <button class="main-btn" onclick="showPage('p2')">OPEN SEAL</button>
    </div>

    <div id="p2" class="page">
        <h2>Choose a Gift 🎁</h2>
        <div class="img-box" style="height:150px;">
            <img src="Photo2.jpeg">
        </div>
        <div class="gift-grid">
            <div class="gift-item" onclick="showPage('p_msg')">✉️<br>MESSAGE</div>
            <div class="gift-item" onclick="showPage('p_flw')">🌻<br>FLOWER</div>
            <div class="gift-item" onclick="showPage('p_cake')">🎂<br>CAKE</div>
        </div>
        <button class="main-btn" style="background:#f1c40f; color:black;" onclick="showPage('p_final')">Go to Final Surprise ✨</button>
    </div>

    <div id="p_msg" class="page">
        <h2>A Little Note...</h2>
        <div class="img-box"><img src="Photo3.jpeg"></div>
        <div class="img-box"><img src="Photo4.jpeg"></div>
        <button class="back-btn" onclick="showPage('p2')">Back to Gifts</button>
    </div>

    <div id="p_flw" class="page">
        <h2>For Someone Beautiful 🌻</h2>
        <div class="img-box"><img src="Photo5.jpeg"></div>
        <button class="back-btn" onclick="showPage('p2')">Back to Gifts</button>
    </div>

    <div id="p_cake" class="page">
        <h2>Happy Birthday Rashi! 🎂</h2>
        <div class="img-box"><img src="Photo6.jpeg"></div>
        <button class="back-btn" onclick="showPage('p2')">Back to Gifts</button>
    </div>

    <!-- ✅ FINAL PAGE -->
    <div id="p_final" class="page">
        <h2>This Song reminds me of you🎵</h2>

        <div class="img-box">
            <img src="Photo7.jpeg">
        </div>

        <button class="main-btn" onclick="playMusic()">Tap to Play 🎵</button>

        <!-- ✅ AUDIO -->
        <audio id="myAudio" preload="auto">
            <source src="song.mp3" type="audio/mpeg">
        </audio>

        <button class="back-btn" onclick="showPage('p2')">Back to Menu</button>
    </div>

</div>

<script>
    function showPage(pageId) {
        var pages = document.querySelectorAll('.page');
        pages.forEach(p => p.classList.remove('active'));
        
        document.getElementById(pageId).classList.add('active');

        // stop music when leaving
        var audio = document.getElementById("myAudio");
        audio.pause();
        audio.currentTime = 0;
    }

    function playMusic() {
        var audio = document.getElementById("myAudio");

        audio.play().then(() => {
            console.log("Playing...");
        }).catch(error => {
            alert("Music play nahi ho raha. Check song.mp3 file!");
            console.log(error);
        });
    }
</script>

</body>
</html>
